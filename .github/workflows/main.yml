
name: KAM APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v5

      - name: Ana klasörü kontrol et
        run: |
          echo "Ana proje klasörü:"
          pwd
          ls -la

      - name: APK derle
        working-directory: ${{ github.workspace }}
        run: ./gradlew --no-daemon -p "$GITHUB_WORKSPACE" :app:assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: KAM-APK
          path: app/build/outputs/apk/debug/*.apk
